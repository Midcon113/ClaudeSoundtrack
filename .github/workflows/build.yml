name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the workflow be re-run by hand after a runner-side failure.
  workflow_dispatch:

jobs:
  build:
    # Windows, not Linux: the app project is WPF (net10.0-windows) and will not
    # build elsewhere, even though Core and the tests are platform-neutral.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Guards the rules that are easy to break without noticing: track-number
      # stripping, cross-disc name collisions, and the flattening arithmetic.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
